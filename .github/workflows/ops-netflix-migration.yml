name: Ops - Netflix Top 10 migration (one-off)

# Temporary. Applies the additive backend migration 20261105120000_add_netflix_top10 to the production
# database using the existing DATABASE_URL secret, then records it in _prisma_migrations if that table exists.
# Remove this workflow after use.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose (read-only) or apply'
        required: true
        default: 'diagnose'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          DB="${RAW_DATABASE_URL%%\?*}?sslmode=require"
          echo "::add-mask::$DB"
          psql "$DB" -v ON_ERROR_STOP=1 -c "select current_database(), version();"
          echo "--- Netflix tables present?"
          psql "$DB" -tAc "select table_name from information_schema.tables where table_name like 'Netflix%'"
          echo "--- _prisma_migrations?"
          HAS=$(psql "$DB" -tAc "select to_regclass('public._prisma_migrations') is not null")
          echo "has_history=$HAS"
          if [ "$HAS" = "t" ]; then psql "$DB" -c 'select migration_name, finished_at from _prisma_migrations order by finished_at desc nulls last limit 5'; fi
          psql "$DB" -tAc 'select count(*) as movies from "Movie"'
          if [ "$MODE" != "apply" ]; then echo "diagnose only"; exit 0; fi
          if [ -n "$(psql "$DB" -tAc "select 1 from information_schema.tables where table_name='NetflixTop10Entry'")" ]; then echo "tables already exist; refusing"; exit 1; fi
          psql "$DB" -v ON_ERROR_STOP=1 --single-transaction -f ops/20261105120000_add_netflix_top10.sql
          if [ "$HAS" = "t" ]; then
            SUM=$(sha256sum ops/20261105120000_add_netflix_top10.sql | cut -d' ' -f1)
            psql "$DB" -v ON_ERROR_STOP=1 -c "insert into _prisma_migrations (id, checksum, migration_name, finished_at, started_at, applied_steps_count) values (gen_random_uuid()::text, '$SUM', '20261105120000_add_netflix_top10', now(), now(), 1)"
          fi
          psql "$DB" -tAc "select table_name from information_schema.tables where table_name like 'Netflix%'"
