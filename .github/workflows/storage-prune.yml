name: Storage prune (manual)

# Deletes stored streaming availability for countries the app does not offer, then compacts the
# tables so Neon counts the space as free. Run with apply=false first to see the plan.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete and compact (false = report only)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: storage-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - name: Prune availability and compact
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KEEP_REGIONS: 'IN,US,GB,CA,AU,DE,FR,JP,KR,BR,MX,ES,IT,NL,SE,TR,ID,PH,TH,ZA'
          PRUNE_APPLY: ${{ github.event.inputs.apply }}
        run: npm run ingestion:storage-prune
